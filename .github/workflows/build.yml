name: Build & Release

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build archibox-agent.exe
        run: |
          pip install pyinstaller pynput mss requests
          pyinstaller --onefile --name archibox-agent --console agent/agent.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish usb-watch
        working-directory: ./usb-watch
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../dist/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archibox-windows
          path: |
            dist/archibox-agent.exe
            dist/archibox-usb-watch.exe
            scripts/install.bat
            scripts/uninstall.bat
          retention-days: 90

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller pyobjc-framework-Quartz Pillow
          pip install --pre pyobjc-framework-Quartz 2>/dev/null || true

      - name: Build macOS app bundle
        run: |
          pyinstaller --onefile --name ArchiBoxAgent --console agent/mac/archibox_agent_mac.py
          mkdir -p "ArchiBoxAgent.app/Contents/MacOS"
          cp dist/ArchiBoxAgent ArchiBoxAgent.app/Contents/MacOS/
          cp -r Resources/ ArchiBoxAgent.app/Contents/ 2>/dev/null || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: archibox-macos
          path: |
            ArchiBoxAgent.app
            dist/ArchiBoxAgent
            scripts/install_mac.sh
          retention-days: 90

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release/

      - name: List artifacts
        run: ls -la release/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
